<title>Halo Start · design file</title>
<!--
HALO START: DESIGN FILE (2026-11-03)
Subject: Start for Halo, a macOS-style shell on Windows. Mode: Operate (always-available desktop surface). Platform: native (C++/WinRT, Windows.UI.Composition).

THE IDEA: Start is the dock's big sibling. It inherits the dock's three behaviours and nothing else moves:
  1. a magnifying wave under the cursor (cosine falloff, springs back on leave)
  2. a spring on press (the thing you pressed pushes in, then settles)
  3. it appears by fading in place (200 ms), no travel. Nothing animates while you read.

SIZE: a rough square. 880 x 780 logical px, the same width as the dock's pill, three panes: notifications | launcher | controls.

TOKENS (named as they will be in src/theme.h / src/tokens.h):
  glass.tint      #16161A @ 72 %   (dark)   #F6F6F9 @ 78 % (light)      blur 40, saturate 1.2
  ink             #F3F3F6          soft .68    dim .46
  fill            white .055       fillHover .09    fillPress .13    line .08
  accent          #EC4899  (only: "on" state, today, the active power mode, slider fill)
  radius          panel 28 · tile 20 · row 12 · pill/round full
  type            Segoe UI Variable Display 28/600 (hello) · Text 18/600 (pane title) · 14/400 body · 12/400 caption
  spacing         4 · 8 · 12 · 16 · 24 (gap between panes 12)
  motion          open: opacity 0→1, 200 ms ease-out, no transform
                  hover wave: scale 1 → 1.28 at the cursor, radius 96 px, cosine falloff
                  press: scale .96 for 140 ms, then spring back (bounce .25)
                  everything else: 140-180 ms ease-out on colour/opacity only

ROUND 2 (borrowed, then made to work on a desktop):
  D · Modules  (macOS)      mixed-size modules; a connectivity CLUSTER (three rows, icon toggles, row expands); notifications grouped by app
                            as a stack that spreads; a date + events widget. Accent only on "on". Neutral vibrancy.
  E · Shade    (One UI)     a giant brightness rail on top; round tiles with the LABEL underneath (icon toggles, label opens); notification
                            cards that expand in place into actions; an agenda instead of a month grid.
  F · Tonal    (Pixel)      the accent becomes a tonal palette (tinted surfaces, not grey); toggles MORPH shape (circle -> squircle) with a
                            spring; a connected notification list; a chunky slider with a handle bar; wavy now-playing progress.
  Desktop translation: no swipe or long-press (the bar is the long-press); hover reveals affordances (x, chevrons); wheel scrolls; stacks spread
  on hover; everything stays flat fills over ONE blur so it is cheap natively; shape morph = two visuals cross-faded, not a path animation.

CONTROLS RULE (his): a tile has two targets. The LOGO circle toggles. The BAR (the rest of the tile) opens: the Wi-Fi / Bluetooth list, or the Settings page for that setting.
-->
<style>
:root{
  --ink:#F3F3F6; --soft:rgba(243,243,246,.68); --dim:rgba(243,243,246,.46);
  --glass:rgba(22,22,26,.72); --glass2:rgba(16,16,20,.80);
  --fill:rgba(255,255,255,.055); --fillH:rgba(255,255,255,.09); --fillP:rgba(255,255,255,.13);
  --line:rgba(255,255,255,.08); --edge:rgba(255,255,255,.10); --rim:rgba(255,255,255,.14);
  --accent:#EC4899; --onAccent:#fff; --off:rgba(255,255,255,.12);
  --shadow:0 30px 80px rgba(0,0,0,.55),0 4px 16px rgba(0,0,0,.35);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; --display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --r-panel:28px; --r-tile:20px; --r-row:12px;
  --ease:cubic-bezier(.23,1,.32,1); --spring:cubic-bezier(.34,1.5,.64,1);
}
[data-theme=light]{
  --ink:#17171B; --soft:rgba(23,23,27,.70); --dim:rgba(23,23,27,.50);
  --glass:rgba(246,246,249,.80); --glass2:rgba(250,250,252,.86);
  --fill:rgba(0,0,0,.045); --fillH:rgba(0,0,0,.075); --fillP:rgba(0,0,0,.11);
  --line:rgba(0,0,0,.09); --edge:rgba(0,0,0,.08); --rim:rgba(255,255,255,.7); --off:rgba(0,0,0,.10);
  --shadow:0 30px 80px rgba(20,22,30,.25),0 4px 16px rgba(20,22,30,.12);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0b0b0d;color:var(--ink);font:14px/1.35 var(--font);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}

/* ---------- toolbar ---------- */
.bar{position:fixed;z-index:50;top:0;left:0;right:0;height:44px;display:flex;gap:6px;align-items:center;padding:0 16px;background:#111114;border-bottom:1px solid #26262b;color:#e9e9ee;font-size:12px}
.bar b,.bar button{white-space:nowrap}
.bar b{font-weight:600;margin-right:10px;letter-spacing:.01em}
.bar .sep{width:1px;height:18px;background:#2c2c32;margin:0 8px}
.bar button{padding:6px 12px;border-radius:8px;color:#b9b9c2;transition:background .14s,color .14s}
.bar button:hover{background:#1e1e23;color:#fff}
.bar button[aria-pressed=true]{background:#2a2a31;color:#fff}
.bar .log{margin-left:auto;color:#8d8d98;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- the desktop (real logical size 1536x960, scaled to fit) ---------- */
#fit{position:absolute;top:44px;left:0;width:100%;height:calc(100% - 44px);display:grid;place-items:center}
#desk{width:1536px;height:960px;position:relative;flex:none;transform-origin:center;overflow:hidden;border-radius:6px;
  background:
   radial-gradient(1100px 700px at 28% 12%,#5a1220 0,transparent 62%),
   radial-gradient(900px 700px at 85% 70%,#2a0f2e 0,transparent 60%),
   linear-gradient(160deg,#2b0c14,#0f0a14 60%,#0a0a10)}
[data-theme=light] #desk{background:
   radial-gradient(1100px 700px at 28% 12%,#f2c6a8 0,transparent 62%),
   radial-gradient(900px 700px at 85% 70%,#c9b6e6 0,transparent 60%),
   linear-gradient(160deg,#e9d5c6,#d7d2e6 60%,#cfd3e3)}
.fakewin{position:absolute;left:96px;top:70px;width:1200px;height:620px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.fakewin i{display:block;height:10px;margin:22px 26px;border-radius:5px;background:rgba(255,255,255,.07)}
[data-theme=light] .fakewin{background:rgba(255,255,255,.35);border-color:rgba(0,0,0,.05)}[data-theme=light] .fakewin i{background:rgba(0,0,0,.07)}

/* the dock, for scale: same pill the real dock draws (880 wide) */
.dock{position:absolute;left:328px;bottom:6px;width:880px;height:62px;border-radius:20px;background:var(--glass);backdrop-filter:blur(40px);border:1px solid var(--edge);display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:inset 0 1px 0 var(--rim)}
.dock .cl{font:600 14px var(--display);padding-right:12px;border-right:1px solid var(--line);margin-right:2px}
.dock .ic{width:34px;height:34px;border-radius:9px;flex:none}

/* ---------- Start ---------- */
.start{position:absolute;left:328px;bottom:80px;width:880px;height:780px;opacity:0}
.start.in{animation:fadein 200ms var(--ease) forwards}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.start.in{animation-duration:1ms}}
.pane{position:absolute;top:0;bottom:0;background:var(--glass);backdrop-filter:blur(40px) saturate(1.2);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 var(--rim);border-radius:var(--r-panel);overflow:hidden;display:flex;flex-direction:column}
.h{display:flex;align-items:center;justify-content:space-between;font:600 18px var(--display)}
.cap{font-size:12px;color:var(--dim)}
.lbl{font:600 12px var(--font);color:var(--dim);letter-spacing:.02em}
.h .btn{font:400 13px var(--font)}
.btn{border-radius:10px;padding:5px 10px;color:var(--soft);transition:background .14s,color .14s,transform .14s var(--spring)}
.btn:hover{background:var(--fillH);color:var(--ink)}
.press:active,.logo:active,.bar2:active,.mag:active{transform:scale(.96)!important}

/* squircle app icon stand-ins (the real shell draws real icons) */
.app{width:var(--sz,48px);height:var(--sz,48px);border-radius:22%;display:grid;place-items:center;color:#fff;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 8px rgba(0,0,0,.35)}
.app svg{width:58%;height:58%}

/* magnify wave */
.mag{transform-origin:50% 100%;transition:transform 320ms var(--spring);will-change:transform;position:relative}
.waving .mag{transition:none}

/* notifications */
.notes{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:0 16px}
.note{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px;border-radius:var(--r-tile);background:var(--fill);position:relative;transition:background .14s}
.note:hover{background:var(--fillH)}
.note .t{font-size:12px;color:var(--dim)}
.note .tt{font-weight:600;margin:1px 0}
.note .bd{color:var(--soft);font-size:13px;line-height:1.35}
.note .x{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--fillP);display:grid;place-items:center;opacity:0;transition:opacity .14s;font-size:11px}
.note:hover .x{opacity:1}
.note.gone{opacity:0;transform:scale(.96);transition:opacity 160ms var(--ease),transform 160ms var(--ease)}
.empty{flex:1;display:grid;place-items:center;color:var(--dim);text-align:center;gap:6px;align-content:center}
.cal{padding:12px 16px 16px;border-top:1px solid var(--line)}
.cal .m{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;row-gap:2px}
.cal .g span{height:26px;display:grid;place-items:center;border-radius:50%;color:var(--soft)}
.cal .g .d{color:var(--dim);font-weight:600;font-size:11px}
.cal .g .t{background:var(--accent);color:var(--onAccent);font-weight:600}

/* search */
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:14px;background:var(--fill);border:1px solid var(--line);color:var(--dim);transition:background .14s,border-color .14s}
.search:focus-within{background:var(--fillH);border-color:var(--rim)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit}
.search input::placeholder{color:var(--dim)}

/* tiles: the logo toggles, the bar opens */
.tile{display:flex;align-items:center;border-radius:var(--r-tile);background:var(--fill);transition:background .14s;position:relative}
.tile:hover{background:var(--fillH)}
.logo{width:40px;height:40px;border-radius:50%;background:var(--off);display:grid;place-items:center;font-size:19px;flex:none;margin:8px 0 8px 8px;transition:background .18s var(--ease),color .18s,transform .14s var(--spring)}
.logo:hover{background:var(--fillP)}
.tile.on .logo{background:var(--accent);color:var(--onAccent)}
.bar2{flex:1;display:flex;align-items:center;justify-content:space-between;align-self:stretch;padding:0 14px 0 12px;border-radius:0 var(--r-tile) var(--r-tile) 0;min-width:0;transition:transform .14s var(--spring)}
.bar2 b{display:block;font-weight:600;white-space:nowrap}
.bar2 small{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar2 svg{color:var(--dim);font-size:14px}
.tile.na{opacity:.5;pointer-events:none}

/* sliders */
.slider{position:relative;height:44px;border-radius:14px;background:var(--off);overflow:hidden;cursor:pointer;touch-action:none}
.slider .fill{position:absolute;inset:0 auto 0 0;width:calc(var(--v)*1%);background:var(--ink);opacity:.92;border-radius:14px 0 0 14px}
.slider .gl{position:absolute;left:14px;top:50%;translate:0 -50%;font-size:18px;mix-blend-mode:difference;color:#fff}
.slider .val{position:absolute;right:14px;top:50%;translate:0 -50%;font-size:12px;font-weight:600;mix-blend-mode:difference;color:#fff}
.slider:active .fill{filter:brightness(1.06)}

/* media */
.media{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:6px 12px;padding:12px;border-radius:var(--r-tile);background:var(--fill)}
.media .art{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#7c3aed,#ec4899 60%,#f59e0b);flex:none}
.media .tx{flex:1;min-width:0}.media .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media .mc{grid-column:1/-1;display:flex;justify-content:space-between;padding:0 18px;font-size:17px}.media .mc button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:background .14s,transform .14s var(--spring)}.media .mc button:hover{background:var(--fillH)}

/* segmented */
.seg{display:flex;padding:3px;border-radius:12px;background:var(--fill)}
.seg button{flex:1;text-align:center;padding:7px 2px;border-radius:9px;font-size:11px;white-space:nowrap;color:var(--soft);transition:background .16s,color .16s}
.seg button[aria-pressed=true]{background:var(--fillP);color:var(--ink);font-weight:600}

/* list rows (wifi detail etc.) */
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-row);transition:background .14s}
.row:hover{background:var(--fillH)}
.row small{color:var(--dim);display:block;font-size:12px}
.fade{animation:fadein 140ms var(--ease)}

.foot{display:flex;align-items:center;gap:6px;padding:12px 16px;border-top:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ec4899);flex:none}
.sp{flex:1}

/* ===== A · SHELF ===== */
#A .p1{left:0;width:256px}#A .p2{left:268px;width:336px}#A .p3{left:616px;width:264px}
#A .p1 .h,#A .p3 .h{padding:20px 20px 12px}
#A .p2{padding:0}
#A .hello{padding:22px 22px 0;display:flex;justify-content:space-between;align-items:flex-end}
#A .hello h1{font:600 30px/1.05 var(--display);letter-spacing:-.01em}
#A .hello .ck{text-align:right}#A .hello .ck b{font:600 18px var(--display);display:block}
#A .quote{padding:8px 22px 0;color:var(--soft);font-size:13px;line-height:1.45}
#A .quote em{font-style:normal;color:var(--dim)}
#A .sbox{padding:16px 22px 0}
#A .sec{padding:18px 22px 6px;display:flex;justify-content:space-between;align-items:center}
#A .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 0;padding:6px 14px 0}
#A .apps button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 0;border-radius:var(--r-row)}
#A .apps span.n{font-size:12px;color:var(--soft);max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#A .files{padding:0 14px}
#A .files .row{padding:8px 10px}
#A .ctl3{padding:0 16px;display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden}
#A .tile{height:52px}
#A .logo{width:36px;height:36px;font-size:17px}
#A .ctl3{gap:6px}

/* ===== B · SLAB ===== one panel, hairline dividers */
#B .slab{position:absolute;inset:0;display:grid;grid-template-columns:244px 1fr 268px;border-radius:var(--r-panel);background:var(--glass);backdrop-filter:blur(40px) saturate(1.2);border:1px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 var(--rim);overflow:hidden}
#B .col{display:flex;flex-direction:column;min-width:0;min-height:0}
#B .col+.col{border-left:1px solid var(--line)}
#B .col1 .h,#B .col3 .h{padding:22px 20px 12px;font-size:14px;color:var(--soft)}
#B .big{padding:26px 28px 0}
#B .big .time{font:200 76px/1 var(--display);letter-spacing:-.03em}
#B .big .date{margin-top:6px;color:var(--soft);font-size:15px}
#B .big .q{margin-top:14px;color:var(--dim);font-size:13px;max-width:34ch;line-height:1.5}
#B .sbox{padding:22px 28px 0}
#B .search{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;height:42px}
#B .search:focus-within{border-color:var(--ink);background:none}
#B .shelf{display:flex;gap:8px 4px;padding:22px 22px 0;flex-wrap:wrap;justify-content:space-between}
#B .shelf button{padding:6px;border-radius:14px}
#B .files{padding:10px 22px 0}
#B .files .row{padding:8px 6px;border-radius:0;border-bottom:1px solid var(--line)}
#B .files .row:hover{background:none;color:var(--ink)}
#B .cc{padding:0 20px;display:flex;flex-direction:column;flex:1;overflow:hidden}
#B .tile{background:none;border-radius:0;border-bottom:1px solid var(--line);height:54px}
#B .tile:hover{background:none}
#B .logo{width:32px;height:32px;font-size:16px;margin:0 0 0 0;border-radius:10px}
#B .bar2{border-radius:0}
#B .note{background:none;border-radius:0;border-bottom:1px solid var(--line);padding:12px 0}
#B .note:hover{background:none}
#B .notes{padding:0 20px}
#B .slider{height:6px;border-radius:3px;overflow:visible;margin:6px 0 2px;background:var(--off)}
#B .slider .fill{border-radius:3px;background:var(--accent)}
#B .slider::after{content:"";position:absolute;left:calc(var(--v)*1%);top:50%;width:16px;height:16px;border-radius:50%;background:var(--ink);translate:-50% -50%;box-shadow:0 1px 6px rgba(0,0,0,.4);transition:scale .14s var(--spring)}
#B .slider:active::after{scale:1.2}
#B .slider .gl,#B .slider .val{display:none}
#B .sl{display:grid;grid-template-columns:1fr auto;align-items:center;padding:12px 0 0}
#B .sl .cap{display:flex;gap:8px;align-items:center}#B .sl b{font-weight:600}

/* ===== C · BENTO ===== */
#C .p1{left:0;width:256px}#C .p2{left:268px;width:336px}#C .p3{left:616px;width:264px;background:var(--glass2)}
#C .h{padding:20px 20px 12px}
#C .stack{flex:1;margin:0 16px;display:flex;flex-direction:column}
#C .stack .note{background:var(--fillH);min-height:98px;margin-top:-84px;transform:scale(.94);transform-origin:50% 0;opacity:.8;transition:margin-top .34s var(--spring),transform .34s var(--spring),opacity .2s}
#C .stack .note:not(:first-child)>*{opacity:0;transition:opacity .16s}
#C .stack:hover .note>*{opacity:1}
#C .stack .note:first-child{margin-top:0;transform:none;opacity:1}
#C .stack:hover .note{margin-top:8px;transform:none;opacity:1}
#C .stack:hover .note:first-child{margin-top:0}
#C .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
#C .grid3 button{aspect-ratio:1;border-radius:var(--r-tile);background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:background .14s}
#C .grid3 button:hover{background:var(--fillH)}
#C .grid3 span.n{font-size:12px;color:var(--soft)}
#C .mega{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
#C .sq{aspect-ratio:1;border-radius:var(--r-tile);background:var(--fill);display:flex;flex-direction:column;padding:10px;position:relative;transition:background .14s}
#C .sq:hover{background:var(--fillH)}
#C .sq .logo{margin:0;width:44px;height:44px;font-size:21px}

/* ===================== ROUND 2: D / E / F ===================== */
.lb2{font:600 13px var(--font);color:var(--soft)}
.mod{background:var(--fillH);border-radius:var(--r-tile)}
.gone{opacity:0;transform:scale(.96);transition:opacity 160ms var(--ease),transform 160ms var(--ease)}

#D .p1{left:0;width:256px}#D .p2{left:268px;width:336px}#D .p3{left:616px;width:264px}
#D .h{padding:20px 20px 12px}#D .h .btn{font:400 13px var(--font)}

  <div class="sbox"><label class="search">${ic('search')}<input id="q" placeholder="Search apps, settings and files" autocomplete="off"></label></div>
  ${appsGrid(44)}<div class="ghead" style="padding:12px 22px 2px"><span class="lb2">Recent files</span></div>${filesL(3)}<span class="sp"></span>${foot()}</section>
 <section class="pane p3"><div class="h" style="padding:16px 18px 8px"><span>Quick settings</span></div>${ctlF()}<div style="padding:6px 12px 12px">${seg()}</div></section></div>`}

/* ---------- render ---------- */
function render(fadeIn=false){
 const root=$('#stage');const D={A:dirA,B:dirB,C:dirC,D:dirD,E:dirE,F:dirF};root.innerHTML=`<div class="start" id="start">${D[S.dir]()}</div>`;
 const st=$('#start');st.dataset.dir=S.dir;if(fadeIn){st.classList.add('in')}else st.style.opacity=1;
 clock();
}
function clock(){$$('#clk').forEach(e=>e.textContent='10:21')}
function renderDock(){const d=$('#dock');d.innerHTML=`<span class="cl">10:21</span><span class="cap" style="display:flex;gap:8px;margin-right:8px;color:var(--soft)">${ic('wifi')} 71%</span>`+APPS.map(a=>`<span class="ic app" style="--sz:34px;background:${a[1]}">${ic(a[2])}</span>`).join('')+`<span class="ic app" style="--sz:34px;background:#6d28d9">${ic('star')}</span><span class="ic app" style="--sz:34px;background:#0ea5e9">${ic('mail')}</span>`}

/* ---------- behaviour ---------- */
// magnify wave: the dock's cosine falloff
document.addEventListener('pointermove',e=>{
 $$('[data-wave]').forEach(w=>{const r=w.getBoundingClientRect(),sc=$('#desk').getBoundingClientRect().width/1536;
  const inside=e.clientX>r.left-20&&e.clientX<r.right+20&&e.clientY>r.top-20&&e.clientY<r.bottom+20;
  w.classList.toggle('waving',inside);
  $$('.mag',w).forEach(m=>{let k=1;if(inside){const b=m.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,
    dx=(e.clientX-cx)/sc,dy=(e.clientY-cy)/sc,d=w.dataset.wave==='x'?Math.abs(dx):Math.hypot(dx,dy),R=96;
    k=1+.28*(Math.cos(Math.min(d/R,1)*Math.PI)+1)/2}
   m.style.transform=`scale(${k.toFixed(3)})`;m.style.zIndex=k>1.05?2:0});});
});
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,tl=a.closest('[data-id]'),id=tl&&tl.dataset.id;
 if(act==='toggle'&&S.t[id].more==='action'){log(`${S.t[id].n} → runs now`)} else if(act==='toggle'){const t=S.t[id];t.on=t.on?0:1;if(id==='dark'||id==='night'||id==='mic')t.s=t.on?'On':'Off';if(id==='air'&&t.on){S.t.wifi.on=0;S.t.bt.on=0}
  log(`Logo clicked → toggled ${t.n} ${t.on?'on':'off'}`);keep();}
 else if(act==='open'){const t=S.t[id];if(t.more==='action'){log(`${t.n} → runs now (the bar does the same as the logo)`)} else if(t.more==='list'){S.detail=id;log(`Bar clicked → opens the ${t.n} list in the control pane`)}else log(`Bar clicked → opens Settings (${t.more})`);keep();}
 else if(act==='back'){S.detail=null;keep()} else if(act==='settings'){log('Opens ms-settings:'+(S.detail==='bt'?'bluetooth':'network-wifi'))}
 else if(act==='dismiss'){const n=a.closest('.note');n.classList.add('gone');setTimeout(()=>{S.notes.splice(+n.dataset.i,1);keep()},170)}
 else if(act==='clear'){S.notes=[];keep();log('Cleared all notifications')}
 else if(act==='mode'){S.mode=+a.dataset.i;keep()} else if(act==='play'){S.playing=!S.playing;keep()}
 else if(act==='cal'){S.calMonth=(S.calMonth+ +a.dataset.d+12)%12;keep()}
 else if(act==='grp'){S.grp=!S.grp;keep()}
 else if(act==='gdismiss'){const n=a.closest('[data-gi]');n.classList.add('gone');setTimeout(()=>{S.g.splice(+n.dataset.gi,1);S.open=-1;keep()},170)}
 else if(act==='gclear'){S.g=[];keep();log('Cleared all notifications')}
 else if(act==='eopen'){const i=+a.closest('[data-gi]').dataset.gi;S.open=S.open===i?-1:i;keep()}
 else if(act==='reply'){log('Opens Messages and focuses the reply box')}
});
function keep(){const q=$('#q');const val=q&&q.value;render(false);const n=$('#q');if(n&&val){n.value=val;filter(val)}}
// sliders: drag
let drag=null;
document.addEventListener('pointerdown',e=>{const s=e.target.closest('.slider');if(!s)return;drag=s;s.setPointerCapture(e.pointerId);setSl(e)});
document.addEventListener('pointermove',e=>{if(drag)setSl(e)});document.addEventListener('pointerup',()=>drag=null);
function setSl(e){const s=drag,r=s.getBoundingClientRect(),sc=$('#desk').getBoundingClientRect().width/1536;
 let v=s.dataset.v?1-(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width;v=Math.max(0,Math.min(1,v));const k=s.dataset.k;S[k]=Math.round(v*100);
 $$(`.slider[data-k=${k}]`).forEach(x=>{x.style.setProperty('--v',S[k]);const t=$('.val',x);if(t)t.textContent=S[k]+'%'});
 const bv=$('#brv'),vv=$('#vlv');if(bv)bv.textContent=S.br+'%';if(vv)vv.textContent=S.vl+'%';log(`${k==='br'?'Display':'Sound'} ${S[k]}%`)}
// search filter
document.addEventListener('input',e=>{if(e.target.id==='q')filter(e.target.value)});
function filter(v){v=v.toLowerCase();$$('.mag[data-n]').forEach(m=>m.style.display=!v||m.dataset.n.toLowerCase().includes(v)?'':'none')}
// toolbar
$$('[data-dir]').forEach(b=>b.onclick=()=>{S.dir=b.dataset.dir;S.detail=null;$$('[data-dir]').forEach(x=>x.setAttribute('aria-pressed',x===b));render(true)});
$('#replay').onclick=()=>render(true);
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'':'light'};
$('#empty').onclick=()=>{S.notes=S.notes.length?[]:NOTES.slice();S.g=S.g.length?[]:NOTES_G.slice();keep()};
$('#detail').onclick=()=>{S.detail=S.detail?null:'wifi';keep()};
// fit the 1536x960 desktop to the window
function fit(){const f=$('#fit'),s=Math.min(f.clientWidth/1536,f.clientHeight/960);$('#desk').style.transform=`scale(${s})`}
addEventListener('resize',fit);
const q=new URLSearchParams(location.search);if(q.get('theme'))document.documentElement.dataset.theme=q.get('theme');if(q.get('dir'))S.dir=q.get('dir');if(q.get('detail'))S.detail=q.get('detail');if(q.get('empty'))S.notes=[];
renderDock();fit();$$('[data-dir]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.dir===S.dir));render(true);
</script>
</body>
</html>
